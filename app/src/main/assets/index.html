          createdAt: item.createdAt,
          remindAt: item.remindAt
        }));
        renderFan();
        renderBoardWheel();
        updateNativeAppearance();
        queueSave();
      };

      const applyWorldTransform = () => {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      };

      const fullScreenCanvasBounds = () => {
        const viewportRect = viewport.getBoundingClientRect();
        const screenRect = screen.getBoundingClientRect();
        return {
          left: screenRect.left - viewportRect.left - CANVAS_EDGE_GUARD,
          right: screenRect.right - viewportRect.left + CANVAS_EDGE_GUARD,
          top: screenRect.top - viewportRect.top - CANVAS_EDGE_GUARD,
          bottom: screenRect.bottom - viewportRect.top + CANVAS_EDGE_GUARD
        };
      };

      const minimumCanvasScaleForViewport = () => {
        const bounds = fullScreenCanvasBounds();
        return Math.min(
        MAX_CANVAS_SCALE,
        Math.max(
          MIN_CANVAS_SCALE,
          (bounds.right - bounds.left) / WORLD_W,
          (bounds.bottom - bounds.top) / WORLD_H
        )
        );
      };

      const clampPan = () => {
        const bounds = fullScreenCanvasBounds();
        scale = Math.max(scale, minimumCanvasScaleForViewport());
        const clampCanvasAxis = (minimum, maximum, position) => {
          if (minimum > maximum) return (minimum + maximum) / 2;
          return clamp(position, minimum, maximum);
        };
        panX = clampCanvasAxis(
          bounds.right - WORLD_W * scale,
          bounds.left,
          panX
        );
        panY = clampCanvasAxis(
          bounds.bottom - WORLD_H * scale,
          bounds.top,
          panY
        );
      };

      const itemRect = (item) => ({
        x: Number(item.dataset.x),
        y: Number(item.dataset.y),
        w: item.offsetWidth || 270,
        h: item.offsetHeight || 58
      });

      const rectanglesOverlap = (a, b, pad = DRIFT_PAD) =>
        a.x < b.x + b.w + pad &&
        a.x + a.w + pad > b.x &&
        a.y < b.y + b.h + pad &&
        a.y + a.h + pad > b.y;

      const findEmptyPosition = (
        w = 220,
        h = 58,
        excludedItem = null,
        { preferBottom = false } = {}
      ) => {
        const centerX = (viewport.clientWidth / 2 - panX) / scale;
        const centerY = (viewport.clientHeight / 2 - panY - keyboardSceneShift) / scale;
        const occupied = [...world.querySelectorAll('.board-item')]
          .filter((item) => item !== excludedItem)
          .map(itemRect);

        const viewLeft = clamp((-panX) / scale, 0, WORLD_W);
        const viewTop = clamp((-panY - keyboardSceneShift) / scale, 0, WORLD_H);
        const viewRight = clamp((viewport.clientWidth - panX) / scale, 0, WORLD_W);
        const captureRect = capture.getBoundingClientRect();
        const viewportRect = viewport.getBoundingClientRect();
        const safeBottomInViewport = Math.max(
          0,
          Math.min(
            viewport.clientHeight - 18,
            captureRect.top - viewportRect.top - 22
          )
        );
        const viewBottom = clamp(
          (safeBottomInViewport - panY - keyboardSceneShift) / scale,
          0,
          WORLD_H
        );
        const visibleCandidates = [];
        const minX = Math.max(18, viewLeft + 18);
        const maxX = Math.min(WORLD_W - w - 18, viewRight - w - 42);
        const minY = Math.max(18, viewTop + 18);
        const maxY = Math.min(WORLD_H - h - 18, viewBottom - h - 18);

        if (preferBottom) {
          for (let y = maxY; y >= minY; y -= 26) {
            const row = [];
            for (let x = minX; x <= maxX; x += 24) {
              row.push({
                x,
                y,
                w,
                h,
                distance: Math.abs(x + w / 2 - centerX)
              });
            }
            row.sort((a, b) => a.distance - b.distance);
            const bottomSpot = row.find((candidate) =>
              !occupied.some((rect) => rectanglesOverlap(candidate, rect))
            );
            if (bottomSpot) {
              return { x: bottomSpot.x, y: bottomSpot.y, inView: true };
            }
          }
        }

        for (let y = minY; y <= maxY; y += 24) {
          for (let x = minX; x <= maxX; x += 24) {
            visibleCandidates.push({
              x,
              y,
              w,
              h,
              distance: Math.hypot(x + w / 2 - centerX, y + h / 2 - centerY)
            });
          }
        }

        visibleCandidates.sort((a, b) => a.distance - b.distance);
        const visibleSpot = visibleCandidates.find((candidate) =>
          !occupied.some((rect) => rectanglesOverlap(candidate, rect))
        );
        if (visibleSpot) {
          return { x: visibleSpot.x, y: visibleSpot.y, inView: true };
        }

        for (let radius = 0; radius <= 560; radius += 64) {
          const steps = Math.max(1, Math.round((Math.PI * 2 * Math.max(radius, 64)) / 72));
          for (let step = 0; step < steps; step += 1) {
            const angle = (Math.PI * 2 * step) / steps - Math.PI / 2;
            const candidateMaxX = Math.max(24, WORLD_W - w - 24);
            const candidateMaxY = Math.max(24, WORLD_H - h - 24);
            const candidate = {
              x: clamp(centerX + Math.cos(angle) * radius - w / 2, 24, candidateMaxX),
              y: clamp(centerY + Math.sin(angle) * radius - h / 2, 24, candidateMaxY),
              w,
              h
            };
            if (!occupied.some((rect) => rectanglesOverlap(candidate, rect))) {
              return { x: candidate.x, y: candidate.y, inView: false };
            }
          }
        }
        return {
          x: clamp(centerX - w / 2, 24, Math.max(24, WORLD_W - w - 24)),
          y: clamp(centerY - h / 2, 24, Math.max(24, WORLD_H - h - 24)),
          inView: false
        };
      };

      const ensureVisible = (x, y, w = 270, h = 64) => {
        const left = x * scale + panX;
        const top = y * scale + panY + keyboardSceneShift;
        const right = (x + w) * scale + panX;
        const bottom = (y + h) * scale + panY + keyboardSceneShift;
        const margin = 42;
        if (left < margin || right > viewport.clientWidth - margin || top < margin || bottom > viewport.clientHeight - margin) {
          panX = viewport.clientWidth / 2 - (x + w / 2) * scale;
          panY = viewport.clientHeight / 2 - (y + h / 2) * scale - keyboardSceneShift;
          clampPan();
          world.classList.add('is-auto-panning');
          applyWorldTransform();
          window.setTimeout(() => world.classList.remove('is-auto-panning'), 460);
        }
      };

      let editingItemShift = { x: 0, y: 0 };

      const positionEditingItem = (item) => {
        if (!item || editingItem !== item) return;
        const screenRect = screen.getBoundingClientRect();
        if (!editingOrigin) {
          const rect = item.getBoundingClientRect();
          editingOrigin = {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2,
            height: rect.height
          };
        }
        const keyboardVisible = screen.classList.contains('is-keyboard-visible')
          && Number.isFinite(editingKeyboardTop);
        // The stage is captured before the keyboard changes any layout, so all
        // cards converge on the same absolute screen coordinate every time.
        const desiredCenterX = editingStage?.x ?? (screenRect.left + screenRect.width / 2);
        const desiredCenterY = editingStage?.y ?? (screenRect.top + screenRect.height / 2 + 38);
        const safeCenterY = keyboardVisible
          ? Math.min(screenRect.bottom, editingKeyboardTop) - 24 - editingOrigin.height / 2
          : desiredCenterY;
        const targetCenterY = keyboardVisible
          ? Math.min(desiredCenterY, safeCenterY)
          : desiredCenterY;
        editingItemShift = {
          x: (desiredCenterX - editingOrigin.x) / Math.max(scale, .01),
          y: (targetCenterY - editingOrigin.y) / Math.max(scale, .01)
        };
        item.style.transform = `translate3d(${editingItemShift.x}px, ${editingItemShift.y}px, 0)`;
      };

      const restoreEditingItemPosition = (item) => {
        if (!item) return;
        editingItemShift = { x: 0, y: 0 };
        item.style.transform = 'translate3d(0, 0, 0)';
      };

      const finishItemEdit = (item, { restoreEmpty = true } = {}) => {
        if (!item || editingItem !== item) return;
        const textNode = item.querySelector('.item-text');
        const originalText = item.dataset.editingOriginal || textNode.textContent;
        const nextText = textNode.textContent.replace(/\s+/g, ' ').trim();
        const finalText = restoreEmpty && !nextText ? originalText : nextText;
        const changed = finalText !== originalText;
        textNode.textContent = finalText;
        textNode.contentEditable = 'false';
        textNode.removeAttribute('spellcheck');
        item.classList.remove('is-editing');
        item.classList.add('is-edit-returning');
        item.removeAttribute('data-editing-original');
        item.setAttribute('aria-label', `${finalText}，双击收进历史`);
        editingItem = null;
        editingStage = null;
        editingOrigin = null;
        textNode.blur();
        // The card owns only a temporary visual transform.  Its saved board
        // coordinates remain untouched when the keyboard closes.
        restoreEditingItemPosition(item);
        window.setTimeout(() => item.classList.remove('is-edit-returning'), 250);
        pendingItemEditChromeRelease = true;
        syncAppViewport();
        scheduleItemEditChromeRelease();
        if (changed) {
          const remindAt = Number(item.dataset.remindAt) || 0;
          if (remindAt > Date.now()) {
            cancelNativeReminder(item.dataset.itemId);
            scheduleNativeReminder(item.dataset.itemId, finalText, remindAt);
          }
          queueSave();
        }
      };

      const beginItemEdit = (item) => {
        if (!item || editingItem === item) return;
        if (pendingItemEditChromeRelease) releaseItemEditChrome();
        if (editingItem) finishItemEdit(editingItem);
        const textNode = item.querySelector('.item-text');
        const stageRect = screen.getBoundingClientRect();
        const originRect = item.getBoundingClientRect();
        editingItem = item;
        keyboardOwner = 'item';
        editingItemShift = { x: 0, y: 0 };
        editingKeyboardTop = null;
        editingStage = {
          x: stageRect.left + stageRect.width / 2,
          y: stageRect.top + stageRect.height / 2 + 38
        };
        editingOrigin = {
          x: originRect.left + originRect.width / 2,
          y: originRect.top + originRect.height / 2,
          height: originRect.height
        };
        item.style.transform = 'translate3d(0, 0, 0)';
        item.dataset.editingOriginal = textNode.textContent;
        item.classList.add('is-editing');
        screen.classList.add('is-item-editing');
        textNode.contentEditable = 'true';
        textNode.setAttribute('spellcheck', 'false');
        positionEditingItem(item);
        textNode.focus({ preventScroll: true });
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(textNode);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
        keepCaptureVisible();
        playFeedback('soft', true);
      };

      const makeBoardItem = (text, position) => {
        const item = document.createElement('div');
        const createdAt = Number(position.createdAt) || Date.now();
        const remindAt = Number(position.remindAt) || 0;
        item.className = 'board-item';
        item.tabIndex = 0;
        item.setAttribute('role', 'button');
        item.dataset.itemId = position.id || makeId();
        item.dataset.x = String(position.x);
        item.dataset.y = String(position.y);
        item.dataset.createdAt = String(createdAt);
        item.dataset.remindAt = String(remindAt);
        item.style.left = `${position.x}px`;
        item.style.top = `${position.y}px`;
        item.setAttribute('aria-label', `${text}，双击收进历史`);
        item.innerHTML = '<span class="floating-card"><span class="item-main"><span class="item-orb" aria-hidden="true"></span><span class="item-text"></span></span><span class="item-meta"><span class="item-reminder"></span><span class="item-time"></span></span></span>';
        item.querySelector('.item-text').textContent = text;
        item.querySelector('.item-reminder').textContent = remindAt > Date.now()
          ? `提醒 · ${formatReminderTime(remindAt)}`
          : '';
        item.querySelector('.item-time').textContent = formatElapsed(createdAt);
        item.querySelector('.item-text').addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            finishItemEdit(item);
          }
          if (event.key === 'Escape') {
            event.preventDefault();
            const textNode = item.querySelector('.item-text');
            textNode.textContent = item.dataset.editingOriginal || textNode.textContent;
            finishItemEdit(item, { restoreEmpty: false });
          }
        });
        item.querySelector('.item-text').addEventListener('focus', keepCaptureVisible);
        world.appendChild(item);
        bindBoardItem(item);
        return item;
      };

      const animateFlight = async (text, startRect, targetItem, waitForPan) => {
        if (waitForPan) {
          await new Promise((resolve) => window.setTimeout(resolve, 470));
        }
        const screenRect = screen.getBoundingClientRect();
        const targetRect = targetItem.getBoundingClientRect();
        const flight = document.createElement('div');
        flight.className = 'flight';
        flight.style.left = `${startRect.left - screenRect.left}px`;
        flight.style.top = `${startRect.top - screenRect.top}px`;
        flight.innerHTML = '<span class="item-orb" aria-hidden="true"></span><span></span>';
        flight.querySelector('span:last-child').textContent = text;
        screen.appendChild(flight);

        const deltaX = targetRect.left - startRect.left;
        const deltaY = targetRect.top - startRect.top;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduceMotion) {
          const animation = flight.animate(
            [
              { transform: 'translate(0, 0) scale(1)', opacity: 1 },
              { transform: `translate(${deltaX + 42}px, ${deltaY * .42}px) scale(.98)`, opacity: 1, offset: .42 },
              { transform: `translate(${deltaX - 20}px, ${deltaY * .8}px) scale(.95)`, opacity: .88, offset: .8 },
              { transform: `translate(${deltaX}px, ${deltaY}px) scale(.92)`, opacity: .08 }
            ],
            { duration: 820, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }
          );
          await animation.finished.catch(() => undefined);
        }
        flight.remove();
        targetItem.style.visibility = '';
        const card = targetItem.querySelector('.floating-card');
        card.classList.add('is-arriving');
        window.setTimeout(() => card.classList.remove('is-arriving'), 560);
      };

      const addToBoard = async (text, sourceRect, metadata = {}) => {
        const item = makeBoardItem(text, {
          id: metadata.id || makeId(),
          x: 0,
          y: 0,
          createdAt: Number(metadata.createdAt) || Date.now(),
          remindAt: Number(metadata.remindAt) || 0
        });
        item.style.visibility = 'hidden';
        await new Promise((resolve) => window.requestAnimationFrame(resolve));
        const measuredWidth = Math.max(1, item.offsetWidth);
        const measuredHeight = Math.max(1, item.offsetHeight);
        const preferBottom = Boolean(metadata.preferBottom);
        const position = findEmptyPosition(measuredWidth, measuredHeight, item, { preferBottom });
        item.dataset.x = String(position.x);
        item.dataset.y = String(position.y);
        item.style.left = `${position.x}px`;
        item.style.top = `${position.y}px`;
        const keepBottomAnchored = preferBottom && screen.classList.contains('is-keyboard-visible');
        if (!position.inView && !keepBottomAnchored) {
          ensureVisible(position.x, position.y, measuredWidth, measuredHeight);
        }
        try {
          await animateFlight(text, sourceRect, item, !position.inView && !keepBottomAnchored);
        } finally {
          item.style.visibility = '';
        }
        queueSave();
        return item;
      };

      const restoreArchivedItem = (snapshot) => {
        const board = snapshot.boardRef;
        if (!board || !boards.includes(board)) return;
        snapshotActiveBoard();
        board.items = board.items.filter((entry) => entry.id !== snapshot.item.id);
        board.items.push({ ...snapshot.item });
        board.history = board.history.filter((entry) => historyId(entry) !== snapshot.item.id);
        const boardIndex = boards.indexOf(board);
        if (boardIndex === activeBoardIndex) {
          makeBoardItem(snapshot.item.text, snapshot.item);
          const restored = [...world.querySelectorAll('.board-item')]
            .find((candidate) => candidate.dataset.itemId === snapshot.item.id);
          if (restored) {
            restored.querySelector('.floating-card').classList.add('is-arriving');
            window.setTimeout(() => restored.querySelector('.floating-card')?.classList.remove('is-arriving'), 560);
          }
          historyItems = historyItems.filter((entry) => historyId(entry) !== snapshot.item.id);
          renderFan();
        }
        if (snapshot.item.remindAt > Date.now()) {
          scheduleNativeReminder(snapshot.item.id, snapshot.item.text, snapshot.item.remindAt);
        }
        playFeedback('bubble', true);
        queueSave();
      };

      const archiveBoardItem = async (item) => {
        if (editingItem === item) finishItemEdit(item);
        const text = item.querySelector('.item-text').textContent;
        const id = item.dataset.itemId;
        const createdAt = Number(item.dataset.createdAt) || Date.now();
        const remindAt = Number(item.dataset.remindAt) || 0;
        const boardRef = boards[activeBoardIndex];
        const archivedSnapshot = {
          boardRef,
          item: {
            id,
            text,
            x: Number(item.dataset.x),
            y: Number(item.dataset.y),
            createdAt,
            remindAt
          }
        };
        const body = item.querySelector('.floating-card');
        const bodyRect = body.getBoundingClientRect();
        const handleRect = fanHandle.getBoundingClientRect();
        const deltaX = handleRect.left - bodyRect.left;
        const deltaY = handleRect.top + handleRect.height / 2 - bodyRect.top - bodyRect.height / 2;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        playFeedback('bubble', true);
        if (!reduceMotion) {
          const animation = body.animate(
            [
              { transform: 'translate(0, 0) scale(1)', opacity: 1 },
              { transform: `translate(${deltaX * .58}px, ${deltaY * .38}px) scale(.8)`, opacity: .9, offset: .58 },
              { transform: `translate(${deltaX}px, ${deltaY}px) scale(.18)`, opacity: 0 }
            ],
            { duration: 680, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }
          );
          await animation.finished;
        }
        item.remove();
        cancelNativeReminder(id);
        historyItems.unshift(historyEntry(text, createdAt, { id, remindAt }));
        fanIndex = 0;
        selectedHistoryIndex = 0;
        renderFan();
        queueSave();
        showUndoCapsule('已收纳', () => restoreArchivedItem(archivedSnapshot));
      };

      const bindBoardItem = (item) => {
        let drag = null;
        let lastTap = 0;
        let longPressTimer = null;
        const clearLongPress = () => {
          if (longPressTimer) {
            window.clearTimeout(longPressTimer);
            longPressTimer = null;
          }
        };
        item.addEventListener('pointerdown', (event) => {
          event.stopPropagation();
          if (item.classList.contains('is-editing')) return;
          item.setPointerCapture(event.pointerId);
          drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            itemX: Number(item.dataset.x),
            itemY: Number(item.dataset.y),
            moved: false,
            longPressed: false
          };
          longPressTimer = window.setTimeout(() => {
            if (!drag || drag.moved || drag.longPressed) return;
            drag.longPressed = true;
            beginItemEdit(item);
          }, 500);
        });

        item.addEventListener('pointermove', (event) => {
          if (!drag || drag.pointerId !== event.pointerId) return;
          if (drag.longPressed) return;
          const dx = (event.clientX - drag.startX) / scale;
          const dy = (event.clientY - drag.startY) / scale;
          if (Math.hypot(dx, dy) > 7) {
            clearLongPress();
            drag.moved = true;
            item.classList.add('is-dragging');
          }
          if (!drag.moved) return;
          const x = clamp(drag.itemX + dx, 12, WORLD_W - item.offsetWidth - 12);
          const y = clamp(drag.itemY + dy, 12, WORLD_H - item.offsetHeight - 12);
          item.dataset.x = String(x);
          item.dataset.y = String(y);
          item.style.left = `${x}px`;
          item.style.top = `${y}px`;
        });

        const finishDrag = (event) => {
          if (!drag || drag.pointerId !== event.pointerId) return;
          clearLongPress();
          const wasMoved = drag.moved;
          const wasLongPressed = drag.longPressed;
          drag = null;
          item.classList.remove('is-dragging');
          if (wasLongPressed) return;
          if (wasMoved) queueSave();
          if (!wasMoved) {
            const now = Date.now();
            if (now - lastTap < 380) {
              lastTap = 0;
              archiveBoardItem(item);
            } else {
              lastTap = now;
            }
          }
        };

        item.addEventListener('pointerup', finishDrag);
        item.addEventListener('pointercancel', finishDrag);
      };

      const SVG_NS = 'http://www.w3.org/2000/svg';
      const FAN_R = 112;
      const FAN_INNER_R = 22;
      const FAN_RING_SLOTS = 14;
      const FAN_VISIBLE_SLOTS = 7;

      const polarPoint = (radius, angle) => {
        const radians = angle * Math.PI / 180;
        return {
          x: FAN_R + Math.cos(radians) * radius,
          y: FAN_R + Math.sin(radians) * radius
        };
      };

      const sectorPath = (startAngle, endAngle) => {
        const outerRadius = FAN_R - 5;
        const innerRadius = FAN_INNER_R;
        const cornerDepth = 12;
        const outerCornerAngle = 3.5;
        const innerCornerAngle = 4.5;
        const outerStartSide = polarPoint(outerRadius - cornerDepth, startAngle);
        const outerStartCorner = polarPoint(outerRadius, startAngle);
        const outerStartArc = polarPoint(outerRadius, startAngle + outerCornerAngle);
        const outerEndArc = polarPoint(outerRadius, endAngle - outerCornerAngle);
        const outerEndCorner = polarPoint(outerRadius, endAngle);
        const outerEndSide = polarPoint(outerRadius - cornerDepth, endAngle);
        const innerEndSide = polarPoint(innerRadius + cornerDepth, endAngle);
        const innerEndCorner = polarPoint(innerRadius, endAngle);
        const innerEndArc = polarPoint(innerRadius, endAngle - innerCornerAngle);
        const innerStartArc = polarPoint(innerRadius, startAngle + innerCornerAngle);
        const innerStartCorner = polarPoint(innerRadius, startAngle);
        const innerStartSide = polarPoint(innerRadius + cornerDepth, startAngle);
        const largeArc = endAngle - startAngle > 180 ? 1 : 0;
        return [
          `M ${outerStartSide.x} ${outerStartSide.y}`,
          `Q ${outerStartCorner.x} ${outerStartCorner.y} ${outerStartArc.x} ${outerStartArc.y}`,
          `A ${outerRadius} ${outerRadius} 0 ${largeArc} 1 ${outerEndArc.x} ${outerEndArc.y}`,
          `Q ${outerEndCorner.x} ${outerEndCorner.y} ${outerEndSide.x} ${outerEndSide.y}`,
          `L ${innerEndSide.x} ${innerEndSide.y}`,
          `Q ${innerEndCorner.x} ${innerEndCorner.y} ${innerEndArc.x} ${innerEndArc.y}`,
          `A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${innerStartArc.x} ${innerStartArc.y}`,
          `Q ${innerStartCorner.x} ${innerStartCorner.y} ${innerStartSide.x} ${innerStartSide.y}`,
          'Z'
        ].join(' ');
      };

      const applyFanSelection = () => {
        [...fanPanel.querySelectorAll('.fan-segment')].forEach((segment) => {
          const selected = Number(segment.dataset.historyIndex) === selectedHistoryIndex;
          segment.classList.toggle('is-selected', selected);
          segment.setAttribute('aria-pressed', String(selected));
        });
      };

      const createGradient = (defs, id, first, second, third) => {
        const gradient = document.createElementNS(SVG_NS, 'linearGradient');
        gradient.id = id;
        gradient.setAttribute('x1', '0%');
        gradient.setAttribute('y1', '0%');
        gradient.setAttribute('x2', '100%');
        gradient.setAttribute('y2', '100%');
        [[0, first], [52, second], [100, third]].forEach(([offset, color]) => {
          const stop = document.createElementNS(SVG_NS, 'stop');
          stop.setAttribute('offset', `${offset}%`);
          stop.style.stopColor = color;
          stop.style.stopOpacity = offset === 52 ? '.88' : '.7';
          gradient.appendChild(stop);
        });
        defs.appendChild(gradient);
      };

      const renderFan = () => {
        fanPanel.replaceChildren();
        if (!historyItems.length) return;

        const renderedCount = Math.min(FAN_RING_SLOTS, historyItems.length);
        if (selectedHistoryIndex < 0 || selectedHistoryIndex >= historyItems.length) {
          selectedHistoryIndex = fanIndex;
        }
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.classList.add('fan-svg');
        svg.setAttribute('viewBox', `0 0 ${FAN_R * 2} ${FAN_R * 2}`);
        svg.setAttribute('role', 'group');
        svg.setAttribute('aria-label', `最多显示${FAN_VISIBLE_SLOTS}条历史事项的圆形滚轮`);

        const defs = document.createElementNS(SVG_NS, 'defs');
        createGradient(defs, 'fan-gradient-a', 'var(--tone-a)', 'var(--tone-b)', 'var(--tone-c)');
        createGradient(defs, 'fan-gradient-b', 'var(--tone-b)', 'var(--tone-c)', 'var(--tone-a)');
        createGradient(defs, 'fan-gradient-c', 'var(--tone-c)', 'var(--tone-a)', 'var(--tone-b)');
        svg.appendChild(defs);

        const group = document.createElementNS(SVG_NS, 'g');
        group.dataset.fanSegments = 'true';
        const slice = 360 / FAN_RING_SLOTS;
        const gap = 1.6;
        const selectedSlot = FAN_RING_SLOTS / 2;
        const startSlot = selectedSlot - Math.floor(renderedCount / 2);

        for (let itemOffset = 0; itemOffset < renderedCount; itemOffset += 1) {
          const slot = (startSlot + itemOffset + FAN_RING_SLOTS) % FAN_RING_SLOTS;
          const relativeIndex = itemOffset - Math.floor(renderedCount / 2);
          const index = (fanIndex + relativeIndex + historyItems.length) % historyItems.length;
          const entry = historyItems[index];
          const textValue = historyText(entry);
          const centerAngle = slot * slice;
          const startAngle = centerAngle - slice / 2 + gap / 2;
          const endAngle = centerAngle + slice / 2 - gap / 2;
          const middleAngle = (startAngle + endAngle) / 2;
          const segment = document.createElementNS(SVG_NS, 'g');
          segment.classList.add('fan-segment');
          if (index === selectedHistoryIndex) segment.classList.add('is-selected');
          segment.dataset.historyIndex = String(index);
          segment.setAttribute('role', 'button');
          segment.setAttribute('aria-label', `${textValue}，双击放回画板`);
          segment.setAttribute('aria-pressed', String(index === selectedHistoryIndex));
          const liftRadians = middleAngle * Math.PI / 180;
          segment.style.setProperty('--lift-x', `${Math.cos(liftRadians) * 4}px`);
          segment.style.setProperty('--lift-y', `${Math.sin(liftRadians) * 4}px`);

          const depth = document.createElementNS(SVG_NS, 'path');
          depth.classList.add('fan-depth');
          depth.setAttribute('d', sectorPath(startAngle, endAngle));
          depth.setAttribute('transform', 'translate(-2 3)');
          const path = document.createElementNS(SVG_NS, 'path');
          path.classList.add('fan-sector');
          path.setAttribute('d', sectorPath(startAngle, endAngle));
          path.setAttribute('fill', `url(#fan-gradient-${['a', 'b', 'c'][index % 3]})`);
          const highlight = document.createElementNS(SVG_NS, 'path');
          highlight.classList.add('fan-highlight');
          highlight.setAttribute('d', sectorPath(startAngle, endAngle));
          highlight.setAttribute('transform', 'translate(-1 -1)');

          const labelPoint = polarPoint((FAN_R + FAN_INNER_R) * .5, middleAngle);
          const label = document.createElementNS(SVG_NS, 'text');
          label.classList.add('fan-label');
          label.setAttribute('x', String(labelPoint.x));
          label.setAttribute('y', String(labelPoint.y));
          label.setAttribute('transform', `rotate(${middleAngle - 180} ${labelPoint.x} ${labelPoint.y})`);
          const labelLimit = 4;
          label.textContent = textValue.length > labelLimit ? `${textValue.slice(0, labelLimit)}…` : textValue;

          segment.append(depth, path, highlight, label);
          segment.addEventListener('click', async () => {
            if (Date.now() < fanSuppressClickUntil) return;
            const now = Date.now();
            const index = Number(segment.dataset.historyIndex);
            if (!Number.isInteger(index) || index < 0 || index >= historyItems.length) return;
            if (lastHistoryTapIndex === index && now - lastHistoryTapAt < 420) {
              lastHistoryTapAt = 0;
              lastHistoryTapIndex = -1;
              const sourceRect = path.getBoundingClientRect();
              const entry = historyItems[index];
              const text = historyText(entry);
              const id = historyId(entry);
              const createdAt = historyCreatedAt(entry);
              const remindAt = historyRemindAt(entry);
              historyItems.splice(index, 1);
              fanIndex = historyItems.length ? fanIndex % historyItems.length : 0;
              selectedHistoryIndex = historyItems.length ? fanIndex : -1;
              closeHistoryWheel();
              renderFan();
              playFeedback('bubble', true);
              await addToBoard(text, sourceRect, { id, createdAt, remindAt });
              if (remindAt > Date.now()) {
                scheduleNativeReminder(id, text, remindAt);
              }
            } else {
              lastHistoryTapIndex = index;
              lastHistoryTapAt = now;
              selectedHistoryIndex = index;
              applyFanSelection();
            }
          });

          group.appendChild(segment);
        }

        svg.appendChild(group);
        fanPanel.appendChild(svg);
      };

      // Keep the existing SVG/DOM nodes during a spin. Replacing the whole
      // panel between animation frames causes a clear-and-repaint flash on
      // mobile WebView, even though the visual geometry has not changed.
      const refreshFan = () => {
        if (!historyItems.length) {
          renderFan();
          return;
        }
        const svg = fanPanel.querySelector('.fan-svg');
        const segments = [...fanPanel.querySelectorAll('.fan-segment')];
        const renderedCount = Math.min(FAN_RING_SLOTS, historyItems.length);
        if (!svg || segments.length !== renderedCount) {
          renderFan();
          return;
        }
        if (selectedHistoryIndex < 0 || selectedHistoryIndex >= historyItems.length) {
          selectedHistoryIndex = fanIndex;
        }
        const startSlot = FAN_RING_SLOTS / 2 - Math.floor(renderedCount / 2);
        segments.forEach((segment, itemOffset) => {
          const relativeIndex = itemOffset - Math.floor(renderedCount / 2);
          const index = (fanIndex + relativeIndex + historyItems.length) % historyItems.length;
          const textValue = historyText(historyItems[index]);
          const selected = index === selectedHistoryIndex;
          segment.dataset.historyIndex = String(index);
          segment.classList.toggle('is-selected', selected);
          segment.setAttribute('aria-label', `${textValue}，双击放回画板`);
          segment.setAttribute('aria-pressed', String(selected));
          const path = segment.querySelector('.fan-sector');
          if (path) path.setAttribute('fill', `url(#fan-gradient-${['a', 'b', 'c'][index % 3]})`);
          const label = segment.querySelector('.fan-label');
          if (label) label.textContent = textValue.length > 4 ? `${textValue.slice(0, 4)}…` : textValue;
          // Keep the slot assignment explicit for assistive hit testing and
          // future updates without touching the painted SVG paths.
          segment.dataset.fanSlot = String((startSlot + itemOffset + FAN_RING_SLOTS) % FAN_RING_SLOTS);
        });
      };

      const stopFanSpin = () => {
        fanQueue = 0;
        fanRunId += 1;
        fanAnimating = false;
        if (fanActiveAnimation) {
          fanActiveAnimation.cancel();
          fanActiveAnimation = null;
        }
        fanActiveDirection = 0;
        const svg = fanPanel.querySelector('.fan-svg');
        svg?.getAnimations().forEach((animation) => animation.cancel());
        if (svg) svg.style.removeProperty('transform');
        refreshFan();
      };

      const drainFanQueue = async () => {
        if (fanAnimating || !historyItems.length || !fanQueue) return;
        fanAnimating = true;
        const runId = ++fanRunId;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const stepAngle = 360 / FAN_RING_SLOTS;
        try {
          while (fanQueue && runId === fanRunId && historyItems.length) {
            const direction = Math.sign(fanQueue);
            fanActiveDirection = direction;
            fanQueue -= direction;
            playFeedback('wheel_tick', true);
            const svg = fanPanel.querySelector('.fan-svg');
            if (!reduceMotion && svg) {
              fanActiveAnimation = svg.animate(
                [
                  { transform: 'rotate(0deg)' },
                  { transform: `rotate(${-direction * stepAngle}deg)` }
                ],
                {
                  duration: 118,
                  easing: 'linear',
                  fill: 'forwards',
                  composite: 'replace'
                }
              );
              await fanActiveAnimation.finished.catch(() => undefined);
              fanActiveAnimation = null;
              // Commit the finished step back to the base layer before
              // updating labels. This prevents the next step from inheriting
              // a stale transform and avoids a repaint jump.
              svg.getAnimations().forEach((animation) => animation.cancel());
              svg.style.removeProperty('transform');
            }
            if (runId !== fanRunId) return;
            fanIndex = (fanIndex + direction + historyItems.length) % historyItems.length;
            selectedHistoryIndex = fanIndex;
            refreshFan();
          }
        } finally {
          if (runId === fanRunId) {
            fanAnimating = false;
            fanActiveDirection = 0;
          }
        }
      };

      const requestFanSpin = (direction, steps = 1) => {
        if (!historyItems.length || !direction) return;
        const normalized = direction > 0 ? 1 : -1;
        if ((fanQueue && Math.sign(fanQueue) !== normalized) ||
            (fanAnimating && fanActiveDirection && fanActiveDirection !== normalized)) {
          stopFanSpin();
        }
        fanQueue = clamp(fanQueue + normalized * steps, -20, 20);
        drainFanQueue();
      };

      const BOARD_R = 100;
      const BOARD_INNER_R = 22;
      const BOARD_RING_SLOTS = 10;

      const boardPolarPoint = (radius, angle) => {
        const radians = angle * Math.PI / 180;
        return {
          x: BOARD_R + Math.cos(radians) * radius,
          y: BOARD_R + Math.sin(radians) * radius
        };
      };

      const boardSectorPath = (startAngle, endAngle) => {
        const outerRadius = BOARD_R - 5;
        const innerRadius = BOARD_INNER_R;
        const cornerDepth = 12;
        const outerCornerAngle = 4;
        const innerCornerAngle = 5;
        const outerStartSide = boardPolarPoint(outerRadius - cornerDepth, startAngle);
        const outerStartCorner = boardPolarPoint(outerRadius, startAngle);
        const outerStartArc = boardPolarPoint(outerRadius, startAngle + outerCornerAngle);
        const outerEndArc = boardPolarPoint(outerRadius, endAngle - outerCornerAngle);
        const outerEndCorner = boardPolarPoint(outerRadius, endAngle);
        const outerEndSide = boardPolarPoint(outerRadius - cornerDepth, endAngle);
        const innerEndSide = boardPolarPoint(innerRadius + cornerDepth, endAngle);
        const innerEndCorner = boardPolarPoint(innerRadius, endAngle);
        const innerEndArc = boardPolarPoint(innerRadius, endAngle - innerCornerAngle);
        const innerStartArc = boardPolarPoint(innerRadius, startAngle + innerCornerAngle);
        const innerStartCorner = boardPolarPoint(innerRadius, startAngle);
        const innerStartSide = boardPolarPoint(innerRadius + cornerDepth, startAngle);
        return [
          `M ${outerStartSide.x} ${outerStartSide.y}`,
          `Q ${outerStartCorner.x} ${outerStartCorner.y} ${outerStartArc.x} ${outerStartArc.y}`,
          `A ${outerRadius} ${outerRadius} 0 0 1 ${outerEndArc.x} ${outerEndArc.y}`,
          `Q ${outerEndCorner.x} ${outerEndCorner.y} ${outerEndSide.x} ${outerEndSide.y}`,
          `L ${innerEndSide.x} ${innerEndSide.y}`,
          `Q ${innerEndCorner.x} ${innerEndCorner.y} ${innerEndArc.x} ${innerEndArc.y}`,
          `A ${innerRadius} ${innerRadius} 0 0 0 ${innerStartArc.x} ${innerStartArc.y}`,
          `Q ${innerStartCorner.x} ${innerStartCorner.y} ${innerStartSide.x} ${innerStartSide.y}`,
          'Z'
        ].join(' ');
      };

      const boardMaskSectorPath = (startAngle, endAngle) => {
        const outerStart = boardPolarPoint(BOARD_R + 4, startAngle);
        const outerEnd = boardPolarPoint(BOARD_R + 4, endAngle);
        return [
          `M ${BOARD_R} ${BOARD_R}`,
          `L ${outerStart.x} ${outerStart.y}`,
          `A ${BOARD_R + 4} ${BOARD_R + 4} 0 0 1 ${outerEnd.x} ${outerEnd.y}`,
          'Z'
        ].join(' ');
      };

      const closeBoardPanels = () => {
        boardEditor.hidden = true;
        boardManager.hidden = true;
        retainedPanel.hidden = true;
      };

      const applyPanelPosition = (panel, key, nextPosition = panelPositions[key]) => {
        const screenRect = screen.getBoundingClientRect();
        const topbarRect = topbar.getBoundingClientRect();
        const captureRect = capture.getBoundingClientRect();
        const panelWidth = panel.offsetWidth || 260;
        const panelHeight = panel.offsetHeight || 180;
        const minX = 8;
        const maxX = Math.max(minX, screenRect.width - panelWidth - 8);
        const minY = Math.max(8, topbarRect.bottom - screenRect.top + 4);
        const maxY = Math.max(minY, captureRect.top - screenRect.top - panelHeight - 8);
        const x = clamp(Number(nextPosition?.x) || minX, minX, maxX);
        const y = clamp(Number(nextPosition?.y) || minY, minY, maxY);
        panelPositions[key] = { x, y };
        panel.style.left = `${x}px`;
        panel.style.top = `${y}px`;
      };

      const bindMovablePanel = (panel, key) => {
        let drag = null;
        panel.addEventListener('pointerdown', (event) => {
          if (event.target.closest('button, input, textarea, select, a')) return;
          event.preventDefault();
          panel.setPointerCapture(event.pointerId);
          drag = {
            id: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            x: panelPositions[key].x,
            y: panelPositions[key].y
          };
          panel.classList.add('is-dragging');
        });
        panel.addEventListener('pointermove', (event) => {
          if (!drag || drag.id !== event.pointerId) return;
          applyPanelPosition(panel, key, {
            x: drag.x + event.clientX - drag.startX,
            y: drag.y + event.clientY - drag.startY
          });
        });
        const finishPanelDrag = (event) => {
          if (!drag || drag.id !== event.pointerId) return;
          drag = null;
          panel.classList.remove('is-dragging');
          queueSave();
        };
        panel.addEventListener('pointerup', finishPanelDrag);
        panel.addEventListener('pointercancel', finishPanelDrag);
      };

      const openNewBoardPanel = () => {
        closeBoardPanels();
        newBoardName.value = '';
        boardEditor.hidden = false;
        applyPanelPosition(boardEditor, 'newBoard');
        newBoardName.focus();
      };

      const openBoardManager = (index) => {
        if (!boards[index]) return;
        closeBoardPanels();
        boardEditingIndex = index;
        manageBoardName.value = boards[index].name;
        manageBoardDelete.hidden = boards.length <= 1;
        boardManager.hidden = false;
        applyPanelPosition(boardManager, 'manageBoard');
        manageBoardName.focus();
      };

      const openRetainedPanel = () => {
        closeBoardPanels();
        renderRetainedBoards();
        retainedPanel.hidden = false;
        applyPanelPosition(retainedPanel, 'retained');
      };

      const renderRetainedBoards = () => {
        retainedList.replaceChildren();
        if (!retainedBoards.length) {
          const empty = document.createElement('p');
          empty.className = 'retained-empty';
          empty.textContent = '这里暂时没有被移走的画板';
          retainedList.appendChild(empty);
          return;
        }
        retainedBoards.forEach((board, index) => {
          const row = document.createElement('div');
          row.className = 'retained-row';
          const copy = document.createElement('div');
          copy.className = 'retained-copy';
          const name = document.createElement('strong');
          name.textContent = board.name;
          const count = document.createElement('small');
          count.textContent = `${board.items.length + board.history.length} 条内容`;
          copy.append(name, count);
          const restore = document.createElement('button');
          restore.className = 'btn btn-ghost';
          restore.type = 'button';
          restore.textContent = '恢复';
          restore.addEventListener('click', () => {
            boards.push(retainedBoards[index]);
            retainedBoards.splice(index, 1);
            boardWheelIndex = boards.length - 1;
            renderRetainedBoards();
            renderBoardWheel();
            playFeedback('confirm', true);
            queueSave();
          });
          const remove = document.createElement('button');
          remove.className = 'btn btn-ghost text-destructive';
          remove.type = 'button';
          remove.textContent = '永久删除';
          remove.addEventListener('click', () => {
            const removedBoard = retainedBoards[index];
            if (!removedBoard) return;
            removedBoard.items.forEach((item) => cancelNativeReminder(item.id));
            retainedBoards.splice(index, 1);
            renderRetainedBoards();
            playFeedback('heavy', true);
            queueSave();
            showUndoCapsule('已删除', () => {
              if (retainedBoards.includes(removedBoard)) return;
              retainedBoards.splice(Math.min(index, retainedBoards.length), 0, removedBoard);
              removedBoard.items.forEach((item) => {
                if (Number(item.remindAt) > Date.now()) {
                  scheduleNativeReminder(item.id, item.text, Number(item.remindAt));
                }
              });
              renderRetainedBoards();
              playFeedback('bubble', true);
              queueSave();
            });
          });
          const actions = document.createElement('div');
          actions.className = 'retained-actions';
          actions.append(restore, remove);
          row.append(copy, actions);
          retainedList.appendChild(row);
        });
      };

      const renderBoardWheel = () => {
        boardWheelPanel.replaceChildren();
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.classList.add('board-wheel-svg');
        svg.setAttribute('viewBox', `0 0 ${BOARD_R * 2} ${BOARD_R * 2}`);
        svg.setAttribute('role', 'group');
        svg.setAttribute('aria-label', '画板选择圆轮，最多显示四个画板');
        const defs = document.createElementNS(SVG_NS, 'defs');
        createGradient(defs, 'board-gradient-a', 'var(--tone-c)', 'var(--tone-a)', 'var(--tone-b)');
        createGradient(defs, 'board-gradient-b', 'var(--tone-a)', 'var(--tone-b)', 'var(--tone-c)');
        const plusMask = document.createElementNS(SVG_NS, 'mask');
        plusMask.id = 'board-plus-reserved-mask';
        const maskBase = document.createElementNS(SVG_NS, 'rect');
        maskBase.setAttribute('width', String(BOARD_R * 2));
        maskBase.setAttribute('height', String(BOARD_R * 2));
        maskBase.setAttribute('fill', 'white');
        const maskCut = document.createElementNS(SVG_NS, 'path');
        maskCut.setAttribute('d', boardMaskSectorPath(50, 94));
        maskCut.setAttribute('fill', 'black');
        plusMask.append(maskBase, maskCut);
        defs.appendChild(plusMask);
        svg.appendChild(defs);

        const rotor = document.createElementNS(SVG_NS, 'g');
        rotor.dataset.boardRotor = 'true';
        rotor.setAttribute('mask', 'url(#board-plus-reserved-mask)');
        const count = Math.min(6, boards.length);
        const firstOffset = count === 1 ? 0 : count <= 3 ? -1 : count <= 5 ? -2 : -3;
        for (let i = 0; i < count; i += 1) {
          const offset = firstOffset + i;
          const slot = (offset + BOARD_RING_SLOTS) % BOARD_RING_SLOTS;
          const index = (boardWheelIndex + offset + boards.length) % boards.length;
          const centerAngle = slot * 36;
          const startAngle = centerAngle - 16.8;
          const endAngle = centerAngle + 16.8;
          const middleAngle = centerAngle;
          const segment = document.createElementNS(SVG_NS, 'g');
          segment.classList.add('board-segment');
          if (index === activeBoardIndex) segment.classList.add('is-selected');
          segment.dataset.boardIndex = String(index);
          segment.setAttribute('role', 'button');
          segment.setAttribute('aria-current', index === activeBoardIndex ? 'true' : 'false');
          segment.setAttribute('aria-label', `${boards[index].name}画板，长按管理`);

          const path = document.createElementNS(SVG_NS, 'path');
          path.classList.add('board-sector');
          path.setAttribute('d', boardSectorPath(startAngle, endAngle));
          path.setAttribute('fill', `url(#board-gradient-${index % 2 ? 'b' : 'a'})`);
          const point = boardPolarPoint((BOARD_R + BOARD_INNER_R) * .5, middleAngle);
          const label = document.createElementNS(SVG_NS, 'text');
          label.classList.add('board-label');
          label.setAttribute('x', String(point.x));
          label.setAttribute('y', String(point.y));
          label.setAttribute('transform', `rotate(${middleAngle} ${point.x} ${point.y})`);
          label.textContent = boards[index].name.length > 4 ? `${boards[index].name.slice(0, 4)}…` : boards[index].name;
          segment.append(path, label);

          let holdTimer = null;
          let held = false;
          let holdCancelled = false;
          let holdStartX = 0;
          let holdStartY = 0;
          segment.addEventListener('pointerdown', (event) => {
            held = false;
            holdCancelled = false;
            holdStartX = event.clientX;
            holdStartY = event.clientY;
            holdTimer = window.setTimeout(() => {
              if (holdCancelled) return;
              held = true;
              const currentIndex = Number(segment.dataset.boardIndex);
              if (Number.isInteger(currentIndex) && currentIndex >= 0 && currentIndex < boards.length) {
                openBoardManager(currentIndex);
              }
            }, 620);
          });
          const clearHold = () => {
            if (holdTimer) window.clearTimeout(holdTimer);
            holdTimer = null;
          };
          segment.addEventListener('pointermove', (event) => {
            if (Math.hypot(event.clientX - holdStartX, event.clientY - holdStartY) > 6) {
              holdCancelled = true;
              clearHold();
            }
          });
          segment.addEventListener('pointerup', clearHold);
          segment.addEventListener('pointercancel', clearHold);
          segment.addEventListener('pointerleave', clearHold);
          segment.addEventListener('click', () => {
            if (held || holdCancelled) return;
            const currentIndex = Number(segment.dataset.boardIndex);
            if (!Number.isInteger(currentIndex) || currentIndex < 0 || currentIndex >= boards.length) return;
            loadBoard(currentIndex);
            boardWheel.classList.remove('is-open');
            boardWheelHandle.setAttribute('aria-expanded', 'false');
          });
          rotor.appendChild(segment);
        }
        svg.appendChild(rotor);

        const add = document.createElementNS(SVG_NS, 'g');
        add.classList.add('board-add-segment');
        add.setAttribute('role', 'button');
        add.setAttribute('aria-label', '新建画板');
        const addPath = document.createElementNS(SVG_NS, 'path');
        addPath.classList.add('board-sector');
        addPath.setAttribute('d', boardSectorPath(54, 90));
        addPath.setAttribute('fill', 'url(#board-gradient-b)');
        const addPoint = boardPolarPoint((BOARD_R + BOARD_INNER_R) * .5, 72);
        const addLabel = document.createElementNS(SVG_NS, 'text');
        addLabel.classList.add('board-label');
        addLabel.setAttribute('x', String(addPoint.x));
        addLabel.setAttribute('y', String(addPoint.y));
        addLabel.textContent = '+';
        add.append(addPath, addLabel);
        add.addEventListener('click', openNewBoardPanel);
        svg.appendChild(add);
        boardWheelPanel.appendChild(svg);
      };

      // Update board labels/selection in place after a wheel step. Keeping the
      // same SVG avoids the visible clear-and-recreate flash between frames.
      const refreshBoardWheel = () => {
        const svg = boardWheelPanel.querySelector('.board-wheel-svg');
        const rotor = boardWheelPanel.querySelector('[data-board-rotor]');
        const segments = [...boardWheelPanel.querySelectorAll('.board-segment')];
        const count = Math.min(6, boards.length);
        if (!svg || !rotor || segments.length !== count) {
          renderBoardWheel();
          return;
        }
        const firstOffset = count === 1 ? 0 : count <= 3 ? -1 : count <= 5 ? -2 : -3;

                { transform: `rotate(${-direction * 36}deg)` }

              { duration: 360, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }

      let fanWheelDelta = 0;
      let fanWheelTimer = null;
      fanPanel.addEventListener('wheel', (event) => {
        event.preventDefault();
        fanWheelDelta += event.deltaY;
        if (fanWheelTimer) window.clearTimeout(fanWheelTimer);
        fanWheelTimer = window.setTimeout(() => {
          const direction = fanWheelDelta > 0 ? -1 : 1;
          const steps = clamp(Math.round(Math.abs(fanWheelDelta) / 72), 1, 10);
          fanWheelDelta = 0;
          fanWheelTimer = null;
          requestFanSpin(direction, steps);

      }, { passive: false });

      let fanSwipe = null;
      fanPanel.addEventListener('pointerdown', (event) => {
        if (fanAnimating || fanQueue) stopFanSpin();
        fanSwipe = {
          id: event.pointerId,
          startY: event.clientY,
          lastStepY: event.clientY,
          currentY: event.clientY,
          startedAt: performance.now(),
          liveSteps: 0,
          moved: false,
          captured: false
        };
      });
      fanPanel.addEventListener('pointermove', (event) => {
        if (!fanSwipe || fanSwipe.id !== event.pointerId) return;
        fanSwipe.currentY = event.clientY;
        if (Math.abs(event.clientY - fanSwipe.startY) > 9 && !fanSwipe.captured) {
          fanSwipe.moved = true;
          fanSwipe.captured = true;
          fanSuppressClickUntil = Date.now() + 520;
          fanPanel.setPointerCapture(event.pointerId);
        }
        const stepDistance = event.clientY - fanSwipe.lastStepY;
        const liveSteps = Math.floor(Math.abs(stepDistance) / 24);
        if (liveSteps > 0) {
          const direction = stepDistance < 0 ? -1 : 1;
          fanSwipe.liveSteps += liveSteps;
          fanSwipe.lastStepY += Math.sign(stepDistance) * liveSteps * 24;
          requestFanSpin(direction, liveSteps);
        }
      });
      fanPanel.addEventListener('pointerup', (event) => {
        if (!fanSwipe || fanSwipe.id !== event.pointerId) return;
        const { moved, startY, currentY, startedAt, liveSteps } = fanSwipe;
        fanSwipe = null;
        if (moved) {
          event.preventDefault();
          const distance = currentY - startY;
          const duration = Math.max(1, performance.now() - startedAt);
          const speed = Math.abs(distance) / duration;
          const inertiaSteps = clamp(Math.round(speed * 3.2), 0, 7);
          const direction = distance < 0 ? -1 : 1;
          if (!liveSteps) requestFanSpin(direction, 1);
          if (inertiaSteps) requestFanSpin(direction, inertiaSteps);
        }
      });
      fanPanel.addEventListener('pointercancel', () => {
        fanSwipe = null;

      modeToggle.addEventListener('click', () => {

        playFeedback('soft', true);
        queueSave();

      feedbackToggle.addEventListener('click', () => {
        const enabling = !feedbackEnabled;
        if (!enabling) playFeedback('soft', true);
        if (!enabling) stopWheelFeedback();
        feedbackEnabled = enabling;
        updateFeedbackToggle();
        if (enabling) playFeedback('confirm', true, true);
        showCaptureStatus(enabling ? '声音与触感已开启' : '声音与触感已关闭');
        queueSave();
      });

      const placeThemeTray = () => {

        const topbarRect = topbar.getBoundingClientRect();

      };

          themeName.textContent = themeLabels[theme];

          window.requestAnimationFrame(() => fluid.classList.add('is-changing'));

          playFeedback('tick', true);
          queueSave();
        });

      viewport.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.board-item')) return;
        viewport.setPointerCapture(event.pointerId);
        canvasPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (canvasPointers.size === 1) {
          panGesture = { id: event.pointerId, x: event.clientX, y: event.clientY, panX, panY };
          viewport.classList.add('is-panning');
        } else if (canvasPointers.size === 2) {
          const points = [...canvasPointers.values()];
          const dx = points[1].x - points[0].x;
          const dy = points[1].y - points[0].y;
          const midpoint = { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
          const rect = viewport.getBoundingClientRect();
          const localMid = { x: midpoint.x - rect.left, y: midpoint.y - rect.top };
          pinchGesture = {
            distance: Math.hypot(dx, dy),
            scale,
            worldX: (localMid.x - panX) / scale,
            worldY: (localMid.y - panY) / scale
          };
          panGesture = null;
        }
      });

        if (!canvasPointers.has(event.pointerId)) return;
        canvasPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (canvasPointers.size === 2 && pinchGesture) {
          const points = [...canvasPointers.values()];
          const dx = points[1].x - points[0].x;
          const dy = points[1].y - points[0].y;
          const nextScale = clamp(
            pinchGesture.scale * Math.hypot(dx, dy) / pinchGesture.distance,
            minimumCanvasScaleForViewport(),
            MAX_CANVAS_SCALE

          const rect = viewport.getBoundingClientRect();
          const localMid = { x: midpoint.x - rect.left, y: midpoint.y - rect.top };
          scale = nextScale;
          panX = localMid.x - pinchGesture.worldX * scale;
          panY = localMid.y - pinchGesture.worldY * scale;

          applyWorldTransform();

          panX = panGesture.panX + event.clientX - panGesture.x;
          panY = panGesture.panY + event.clientY - panGesture.y;
          clampPan();
          applyWorldTransform();
        }
      });

        viewport.classList.remove('is-panning');
        pinchGesture = null;
        if (canvasPointers.size === 1) {
          const [id, point] = [...canvasPointers.entries()][0];
          panGesture = { id, x: point.x, y: point.y, panX, panY };
        } else {
          panGesture = null;

        queueSave();
      };

      viewport.addEventListener('pointercancel', finishCanvasPointer);

      const sendText = async () => {

        voiceWave.style.setProperty('--voice-level', '.28');

        voiceGesture = null;
        voiceFinalText = '';
        voicePartialText = '';
        voiceReleased = false;
        voiceSessionCancelled = false;
        hideVoicePanel();

      const commitVoiceResult = () => {
        const result = voiceFinalText.trim();

          id: event.pointerId,
          startY: event.clientY,

          cancel: false
        };

        voicePartialText = '';
        voiceReleased = false;

        voicePreview.textContent = shouldCancel

        const elapsed = performance.now() - voiceGesture.startedAt;
        const quickEmpty = elapsed < 360 && !voiceFinalText.trim() && !voicePartialText.trim();
        const cancel = forceCancel || voiceGesture.cancel || quickEmpty;

        const messages = {
          1: '语音连接超时，请再试一次',
          2: '当前网络不可用，无法识别语音',
          3: '录音启动失败，请检查麦克风',
          4: '语音服务暂时不可用，请稍后重试',
          5: '语音识别未能启动，请再试一次',
          6: '没有听到声音，请再试一次',
          7: '没有听清，请再试一次',
          8: '语音服务正忙，请稍后重试',
          9: '需要允许麦克风权限才能使用语音',
          10: '尝试次数太频繁，请稍后再试',
          11: '语音服务连接中断，请再试一次',
          12: '这台手机暂不支持当前语音识别',
          13: '中文语音模型暂时不可用'
        };
        const message = messages[Number(code)] || '语音识别暂时失败，请再试一次';
        clearVoiceSession();
        showCaptureStatus(message, 3200);
      };

      window.onNativeReminderFallback = () => {
        showCaptureStatus('事项已保存；系统可能稍后提醒', 2600);
      };

      window.onNativeReminderError = () => {
        showCaptureStatus('事项已保存，但系统提醒设置失败', 2800);
      };

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          sendText();
        }
      });

      root.addEventListener('contextmenu', (event) => {
        if (!event.target.closest('input, textarea')) event.preventDefault();
      });
      root.addEventListener('selectstart', (event) => {
        if (!event.target.closest('input, textarea')) event.preventDefault();
      });
      root.addEventListener('dragstart', (event) => event.preventDefault());

      bindMovablePanel(boardEditor, 'newBoard');
      bindMovablePanel(boardManager, 'manageBoard');
      bindMovablePanel(retainedPanel, 'retained');
      const restoredSavedState = loadSavedState();
      updateFeedbackToggle();
      updateDateHeading();
      historyItems = boards[activeBoardIndex].history.slice();
      boards[activeBoardIndex].items.forEach((item) => makeBoardItem(item.text, {
        id: item.id,
        x: item.x,
        y: item.y,
        createdAt: item.createdAt,
        remindAt: item.remindAt
      }));
      if (!restoredSavedState) {
        window.requestAnimationFrame(() => {
          const welcomeItem = world.querySelector(`[data-item-id="${WELCOME_ITEM_ID}"]`);
          if (!welcomeItem) return;
          const x = clamp((viewport.clientWidth / scale - welcomeItem.offsetWidth) / 2, 12, WORLD_W - welcomeItem.offsetWidth - 12);
          const y = clamp((viewport.clientHeight / scale - welcomeItem.offsetHeight) / 2, 12, WORLD_H - welcomeItem.offsetHeight - 12);
          welcomeItem.dataset.x = String(x);
          welcomeItem.dataset.y = String(y);
          welcomeItem.style.left = `${x}px`;
          welcomeItem.style.top = `${y}px`;
          queueSave();
        });
      }
      themeName.textContent = themeLabels[screen.dataset.theme] || '白羊';
      root.querySelectorAll('[data-theme-choice]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.themeChoice === screen.dataset.theme));
      });
      const initialDark = screen.dataset.mode === 'dark';
      modeToggle.setAttribute('aria-pressed', String(initialDark));
      modeToggle.setAttribute('aria-label', initialDark ? '切换为明亮色系' : '切换为深色色系');
      modeIcon.textContent = initialDark ? '◐' : '☀';
      updateNativeAppearance();
      window.setInterval(() => {
        world.querySelectorAll('.board-item').forEach((item) => {
          const time = item.querySelector('.item-time');
          if (time) time.textContent = formatElapsed(Number(item.dataset.createdAt));
        });
      }, MINUTE);
      canvasBoundsReady = true;
      clampPan();
      applyWorldTransform();
      rescheduleFutureReminders();
      queueSave();
      window.requestAnimationFrame(() => {
        placeFan(fanTop);
        placeBoardWheel(boardWheelTop);
        renderFan();
        renderBoardWheel();
      });
      window.setTimeout(() => {
        splashIntro.classList.add('is-leaving');
        window.setTimeout(() => splashIntro.remove(), 420);
      }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 900 : 1780);
      window.addEventListener('resize', () => {
        clampPan();
        applyWorldTransform();
        placeFan(fanTop);
        placeBoardWheel(boardWheelTop);
        if (!themeTray.hidden) placeThemeTray();
        if (!boardEditor.hidden) applyPanelPosition(boardEditor, 'newBoard');
        if (!boardManager.hidden) applyPanelPosition(boardManager, 'manageBoard');
        if (!retainedPanel.hidden) applyPanelPosition(retainedPanel, 'retained');
      });
      window.addEventListener('pagehide', saveStateNow);
    })();
  </script>
  <script src="vn/vn-data.js"></script>
  <script src="vn/vn-player.js"></script>
</div>
</body>
</html>
