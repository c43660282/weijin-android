    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#96e8e8" stop-opacity=".68"/><stop offset=".45" stop-color="#8e83ec" stop-opacity=".25"/><stop offset="1" stop-color="#e8c6f5" stop-opacity=".5"/></linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b1741"/><stop offset=".48" stop-color="#42285f"/><stop offset="1" stop-color="#101428"/></linearGradient>
